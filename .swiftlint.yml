# =============================================================================
# SwiftLint configuration — https://github.com/realm/SwiftLint
# Aligned with Promptomize iOS conventions in CLAUDE.md (Swift 6, MVVM,
# @Observable, actor-based networking).
# =============================================================================

# Paths
included:
  - Prompt
  - PromptKeyboard
  - PromptWidgetExtension
  - PromptUITests

excluded:
  - Pods
  - Carthage
  - build
  - DerivedData
  - .build
  - .swiftpm
  - Prompt/Generated
  - Prompt/PrivacyInfo.xcprivacy
  - "**/*.generated.swift"

# Rules disabled (we accept these intentionally)
disabled_rules:
  - todo                     # Inline TODOs are useful during development; CI checks lint elsewhere
  - trailing_comma           # Conflicts with multi-line array/dict styles preferred in SwiftUI
  - line_length              # Configured separately below with relaxed limits
  - identifier_name          # Re-enabled with custom config below

# Opt-in rules (highly recommended)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - convenience_type
  - discouraged_object_literal
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - fallthrough
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# Custom thresholds
line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 800
  error: 1500

type_body_length:
  warning: 500
  error: 800

function_body_length:
  warning: 80
  error: 150

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 5

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 60
    error: 80
  excluded:
    - id
    - x
    - y
    - z
    - to
    - on
    - of
    - by
    - up

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 80

# Project-specific custom rules
custom_rules:
  no_print_statements:
    name: "No print() in production code"
    regex: '(?<![:\.])\bprint\('
    match_kinds:
      - identifier
    message: "Use the AnalyticsService logger or os.Logger instead of print()."
    severity: warning
    excluded:
      - PromptUITests
      - Prompt/Configuration
