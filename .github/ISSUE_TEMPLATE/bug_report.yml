name: Bug report
description: Report a defect in the iOS app, web app, backend API, or related tooling.
title: "[bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can —
        the more context you provide, the faster we can reproduce and fix the issue.

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of the system is affected?
      options:
        - iOS app
        - Widget extension
        - Keyboard extension
        - Web app (promptomize.app)
        - Backend API
        - Enterprise / Public API
        - ChatGPT App (MCP)
        - CI / Tooling
        - Documentation
        - Other / Not sure
      default: 0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / build
      description: |
        iOS — Settings → About → Version & Build.
        Web — visible in the footer of promptomize.app.
        Backend — the Railway deployment ID or commit SHA.
      placeholder: e.g. iOS 2.0 (3) / Web 2.0.0 / Backend 76a5d375
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device / environment
      description: |
        iOS — device model + iOS version.
        Web — browser + version + OS.
        Backend — Node version, OS, and whether reproduced locally or in production.
      placeholder: e.g. iPhone 16 Pro · iOS 18.4 / Chrome 134 macOS 15.3 / Local Node 20.12
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably reproduce the issue.
      placeholder: |
        1. Open the iOS app
        2. Tap …
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages, stack traces, or screenshots.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / network traces
      description: Paste any relevant logs (`pino` JSON, Crashlytics, Xcode console, browser DevTools, server response).
      render: text

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — recent changes, related issues, screenshots, etc.

  - type: checkboxes
    id: security
    attributes:
      label: Confirmation
      options:
        - label: This is **not** a security vulnerability. (For security issues, see SECURITY.md.)
          required: true
        - label: I have searched existing issues and this is not a duplicate.
          required: true
