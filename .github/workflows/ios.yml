name: iOS CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'Prompt/**'
      - 'Prompt.xcodeproj/**'
      - 'PromptKeyboard/**'
      - 'PromptWidgetExtension/**'
      - 'tests/ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Prompt/**'
      - 'Prompt.xcodeproj/**'
      - 'PromptKeyboard/**'
      - 'PromptWidgetExtension/**'
      - 'tests/ios/**'
      - '.github/workflows/ios.yml'

jobs:
  build:
    name: Build and Subscription Checks
    timeout-minutes: 30
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Prompt.xcodeproj \
            -scheme Prompt \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Check configuration and subscription responses
        run: |
          swiftc -parse-as-library \
            Prompt/Configuration/APIConfiguration.swift \
            Prompt/Models/SubscriptionModels.swift \
            tests/ios/SubscriptionRegressionChecks.swift \
            -o "$RUNNER_TEMP/subscription-checks"
          "$RUNNER_TEMP/subscription-checks"

  archive:
    name: Archive for App Store
    timeout-minutes: 30
    runs-on: macos-26
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Apple Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Import certificate from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision

          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Prompt.xcodeproj \
            -scheme Prompt \
            -archivePath $RUNNER_TEMP/Prompt.xcarchive \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            | xcbeautify

      - name: Export IPA
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Prompt.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist Prompt/ExportOptions.plist \
            | xcbeautify

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prompt-${{ github.sha }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 14

      - name: Cleanup Keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
