name: Lint & Format

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'chatgpt-app/**'
      - '.github/workflows/lint.yml'
      - '.prettierrc'
      - '.prettierignore'
      - '.editorconfig'

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint · format · typecheck)
    runs-on: ubuntu-latest
    if: |
      contains(github.event.pull_request.changed_files, 'backend/') ||
      github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  web:
    name: Web (lint · format · typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
