name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'chatgpt-app/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'chatgpt-app/**'
      - '.github/workflows/codeql.yml'
  schedule:
    # Weekly Monday 06:00 UTC scan to catch advisories that publish after merge
    - cron: '0 6 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths:
              - backend/src
              - web/app
              - web/components
              - web/lib
              - web/middleware.ts
              - chatgpt-app/src
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/.next'
              - '**/build'
              - '**/coverage'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
