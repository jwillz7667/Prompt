name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: promptomize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/promptomize_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-access-secret-for-ci
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Apply migrations exactly as production does at boot, instead of
      # `prisma db push`. `db push` reconciles the DB to schema.prisma and
      # never exercises the migration files, so a broken or drifted migration
      # passed CI and only failed in production (where `migrate deploy` runs).
      - name: Apply migrations (production parity)
        run: npx prisma migrate deploy

      # Fail the build if the migrations do not fully reproduce schema.prisma.
      # This is the guard that would have caught the imageAttachment drift:
      # schema.prisma declared the column but no migration created it, so the
      # live schema and the datamodel diverge. `--exit-code` returns non-zero
      # when a diff exists.
      - name: Verify no schema drift between migrations and schema.prisma
        run: |
          npx prisma migrate diff \
            --from-database-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Serialize deploys. Without this, two pushes in quick succession race:
    # the second `railway up` can finish before the first, leaving the older
    # commit as the live release. cancel-in-progress:false lets an in-flight
    # deploy finish (never interrupt a rollout) and queues the next one.
    concurrency:
      group: backend-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # No --detach: a detached `railway up` returns the moment the upload
      # finishes, so the verification step below would poll while the OLD
      # version is still live and report a false green. Blocking until the
      # deployment reaches SUCCESS makes the CLI exit non-zero on a failed
      # build or a healthcheck that never passes, failing the pipeline.
      #
      # Runs from the repo root, NOT backend/: the Railway service has
      # Root Directory = /backend, so it resolves `backend/` INSIDE the
      # uploaded snapshot. Uploading from backend/ produces a snapshot with
      # no `backend/` entry and the build fails with
      # "lstat .../backend: no such file or directory" (deploy 55a92735).
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service backend

      # By the time the blocking deploy returns, Railway has already flipped
      # traffic (its healthcheckPath is /health/live — liveness only — so a
      # process that boots in DB-degraded mode does not crash-loop). This poll
      # hits the comprehensive /health (503 if DB/Redis/queues are in error) so
      # a deploy that is alive but cannot reach its dependencies still turns the
      # pipeline red instead of silently serving a broken backend.
      - name: Verify deployment health
        run: |
          URL="https://backend-production-d538.up.railway.app/health"
          echo "Polling $URL for a healthy response..."
          for attempt in $(seq 1 30); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "Attempt ${attempt}/30: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
          done
          echo "::error::Deployment did not report healthy within 5 minutes"
          exit 1
