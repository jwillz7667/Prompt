name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: promptomize_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/promptomize_test
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-access-secret-for-ci
      JWT_REFRESH_SECRET: test-refresh-secret-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Apply migrations exactly as production does at boot, instead of
      # `prisma db push`. `db push` reconciles the DB to schema.prisma and
      # never exercises the migration files, so a broken or drifted migration
      # passed CI and only failed in production (where `migrate deploy` runs).
      - name: Apply migrations (production parity)
        run: npx prisma migrate deploy

      # Fail the build if the migrations do not fully reproduce schema.prisma.
      # This is the guard that would have caught the imageAttachment drift:
      # schema.prisma declared the column but no migration created it, so the
      # live schema and the datamodel diverge. `--exit-code` returns non-zero
      # when a diff exists.
      - name: Verify no schema drift between migrations and schema.prisma
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: TypeScript check
        run: npx tsc --noEmit

      # Integration tests run against the job's Postgres service container;
      # test/setup-env.ts keeps the CI-provided DATABASE_URL because CI=true.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Railway's GitHub integration deploys this service itself on every push to
  # main (the service is repo-connected with Root Directory /backend). Running
  # `railway up` here as well raced that build — two deployments of the same
  # commit competed and one always FAILED (deploys a5ada28e, 55a92735). CI's
  # job is therefore verification only: wait for Railway's own rollout to
  # serve a healthy response, and turn the pipeline red if it never does.
  verify-deploy:
    name: Verify Railway deployment
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Serialize verification across queued pushes so a green check always
    # refers to the most recently verified rollout, never an interleaving.
    concurrency:
      group: backend-deploy
      cancel-in-progress: false

    steps:
      # Polls the comprehensive /health (503 if DB/Redis/queues/config are in
      # error), not /health/live: Railway's own healthcheck is liveness-only
      # so a process that boots in dependency-degraded mode still goes live —
      # this gate is what catches an alive-but-broken backend. 10 minutes
      # covers Railway's queue + Docker build + healthcheck window.
      - name: Wait for Railway rollout to become healthy
        # Override the workflow default (backend/): this job never checks out
        # the repo, so that directory does not exist on the runner.
        working-directory: ${{ github.workspace }}
        run: |
          URL="https://backend-production-d538.up.railway.app/health"
          echo "Polling $URL for a healthy response..."
          for attempt in $(seq 1 60); do
            sleep 10
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" || echo "000")
            echo "Attempt ${attempt}/60: HTTP ${code}"
            if [ "$code" = "200" ]; then
              echo "Deployment is healthy."
              exit 0
            fi
          done
          echo "::error::Deployment did not report healthy within 10 minutes"
          exit 1
